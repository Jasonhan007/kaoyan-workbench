<!-- AI生成 -->
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>考研工作台</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="考研工作台">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#05070E">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css?v=20260930">
</head>
<body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>


<div class="ambient" aria-hidden="true">
  <span class="blob b1"></span>
  <span class="blob b2"></span>
  <span class="blob b3"></span>
  <span class="blob b4"></span>
  <span class="grain"></span>
</div>

<div class="app">

  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark" id="topMark">01</div>
        <div class="brand-text">
          <div class="brand-title" id="topTitle">今日</div>
          <div class="brand-sub" id="topSub">杭州电子科技大学 · 11408</div>
        </div>
      </div>
      <button class="icon-btn" id="quickAdd" aria-label="快速记录">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <main id="main">

    <!-- ─────────── 今日 ─────────── -->
    <section class="page active" id="page-today">
      <div id="countdownCard"></div>
      <div id="planCard"></div>
      <div id="todayTodoCard"></div>
      <div id="gapCard"></div>
      <div id="recentCard"></div>
    </section>

    <!-- ─────────── 成绩 ─────────── -->
    <section class="page" id="page-scores">
      <h1 class="page-title">成绩</h1>
      <p class="page-sub" id="scoresSub"></p>
      <div id="goalGrid"></div>
      <div class="card" id="trendCard">
        <div class="card-head">
          <h2 class="card-title">成绩趋势</h2>
          <span class="card-hint" id="trendHint"></span>
        </div>
        <div class="seg" id="trendSeg" role="tablist"></div>
        <div class="chart-wrap" id="trendChart"></div>
      </div>
      <h2 class="section-title">全部记录 <span id="recordCount"></span></h2>
      <div id="recordList"></div>
      <button class="btn-primary" id="addRecordBtn">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        记录一次成绩
      </button>
    </section>

    <!-- ─────────── 日历 ─────────── -->
    <section class="page" id="page-calendar">
      <h1 class="page-title">日历</h1>
      <p class="page-sub" id="calSub"></p>
      <div class="card" id="calCard">
        <div class="cal-head">
          <button class="icon-btn sm" id="calPrev" aria-label="上个月">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="cal-month" id="calMonth">2026 年 9 月</button>
          <button class="icon-btn sm" id="calNext" aria-label="下个月">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <div class="cal-week" id="calWeek"></div>
        <div class="cal-grid" id="calGrid"></div>
        <div class="cal-foot">
          <span class="dot-legend"><i class="dot todo"></i>有事项</span>
          <span class="dot-legend"><i class="dot done"></i>已完成</span>
          <button class="btn-ghost sm" id="calTodayBtn">回到今天</button>
        </div>
      </div>
      <div id="dayDetail"></div>
    </section>

    <!-- ─────────── 设置 ─────────── -->
    <section class="page" id="page-settings">
      <h1 class="page-title">设置</h1>
      <p class="page-sub">目标与偏好会即时保存到本机</p>
      <div id="settingsGroups"></div>
      <p class="foot-note">数据存储于本机 Safari LocalStorage · 清除浏览器数据会一并清除</p>
    </section>

  </main>

  <nav class="tabbar" id="tabbar">
    <div class="tabbar-glass">
      <button class="tab active" data-tab="today">
        <svg viewBox="0 0 24 24" width="23" height="23"><path d="M4 10.5 12 4l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 19z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M9.5 20.5V14h5v6.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
        <span>今日</span>
      </button>
      <button class="tab" data-tab="scores">
        <svg viewBox="0 0 24 24" width="23" height="23"><path d="M4 19V5M4 19h16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M8 15.5l3.5-4 3 2.5L20 8" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>成绩</span>
      </button>
      <button class="tab" data-tab="calendar">
        <svg viewBox="0 0 24 24" width="23" height="23"><rect x="3.5" y="5.5" width="17" height="15" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 10.5h17M8.5 3.5v3.5M15.5 3.5v3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>日历</span>
      </button>
      <button class="tab" data-tab="settings">
        <svg viewBox="0 0 24 24" width="23" height="23"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.6v2.2M12 18.2v2.2M4.9 7.8l1.9 1.1M17.2 15.1l1.9 1.1M4.9 16.2l1.9-1.1M17.2 8.9l1.9-1.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span>设置</span>
      </button>
    </div>
  </nav>

</div>

<div class="sheet-root" id="sheetRoot" aria-hidden="true">
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grab"></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script src="app.js?v=20260930"></script>
</body>
</html>
